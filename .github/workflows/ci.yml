name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Sibling repos are checked out inside the workspace (actions/checkout refuses
# paths outside $GITHUB_WORKSPACE), then symlinked to ../<name> so the
# `../tpt-telos` and `../tpt-archon` path dependencies resolve as they do locally.
jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-telos
          path: _siblings/tpt-telos
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-archon
          path: _siblings/tpt-archon
      - name: Link sibling repos
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-telos" "$GITHUB_WORKSPACE/../tpt-telos"
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-archon" "$GITHUB_WORKSPACE/../tpt-archon"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  verify-examples:
    name: nexus verify on examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-telos
          path: _siblings/tpt-telos
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-archon
          path: _siblings/tpt-archon
      - name: Link sibling repos
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-telos" "$GITHUB_WORKSPACE/../tpt-telos"
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-archon" "$GITHUB_WORKSPACE/../tpt-archon"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify example .telos files
        run: |
          cargo run -q -p tpt-nexus-cli -- verify examples/monotonic_timestamp.telos
          cargo run -q -p tpt-nexus-cli -- verify examples/capability_boundary.telos
          cargo run -q -p tpt-nexus-cli -- verify examples/compiled_artifact.telos --compile

  fuzz-examples:
    name: nexus fuzz on examples + templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-telos
          path: _siblings/tpt-telos
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-archon
          path: _siblings/tpt-archon
      - name: Link sibling repos
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-telos" "$GITHUB_WORKSPACE/../tpt-telos"
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-archon" "$GITHUB_WORKSPACE/../tpt-archon"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fuzz the derived capability surface of every example and template
        run: |
          for f in examples/*.telos; do
            cargo run -q -p tpt-nexus-cli -- fuzz "$f"
          done
          for t in counter ledger kv_store oracle rate_limiter multi_module; do
            cargo run -q -p tpt-nexus-cli -- fuzz "templates/$t.telos"
          done

  # Guard against silent drift between this harness and the siblings it builds
  # against. Each matrix entry pins a (telos, archon) ref pair and a Rust
  # toolchain; if a bump breaks the integration, this job fails before the change
  # is merged. Add rows here when a released sibling tag should be tracked.
  compatibility-matrix:
    name: compatibility matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - telos-ref: main
            archon-ref: main
            rust: stable
          - telos-ref: main
            archon-ref: main
            rust: beta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-telos
          ref: ${{ matrix.telos-ref }}
          path: _siblings/tpt-telos
      - uses: actions/checkout@v7
        with:
          repository: TPT-Org/tpt-archon
          ref: ${{ matrix.archon-ref }}
          path: _siblings/tpt-archon
      - name: Link sibling repos
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-telos" "$GITHUB_WORKSPACE/../tpt-telos"
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-archon" "$GITHUB_WORKSPACE/../tpt-archon"
      # `uses:` does not accept expressions, so the toolchain is an input instead.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test against pinned siblings
        run: cargo test --workspace
