name: nexus security scan

# Uploads a SARIF capability-surface delta to the GitHub Security tab. The delta
# is produced by `nexus diff supply_chain_before.telos supply_chain_after.telos
# --sarif`: a supply-chain "refactor" that silently escalates a read-only query
# into a state mutator shows up as a `nexus/capability/changed` finding at the
# `error` level, attached to the offending file.
#
# This workflow is intentionally separate from `ci.yml` so the
# `security-events: write` permission is not granted repo-wide.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    name: capability delta -> Security tab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-telos
          path: _siblings/tpt-telos
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-archon
          path: _siblings/tpt-archon
      - name: Link sibling repos
        run: |
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-telos" "$GITHUB_WORKSPACE/../tpt-telos"
          ln -sfn "$GITHUB_WORKSPACE/_siblings/tpt-archon" "$GITHUB_WORKSPACE/../tpt-archon"
      - uses: dtolnay/rust-toolchain@stable
      # `nexus diff` exits non-zero when it finds a regression, and this pair
      # is a regression on purpose. The SARIF is still written, so accept the
      # exit code and let the upload carry the finding. A missing SARIF file
      # (a real build or runtime failure) still fails the step.
      - name: Diff the supply-chain narrative pair to SARIF
        run: |
          cargo run -q -p tpt-nexus-cli -- \
            diff examples/supply_chain_before.telos examples/supply_chain_after.telos \
            --sarif examples/supply_chain_delta.sarif || true
          test -s examples/supply_chain_delta.sarif
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/supply_chain_delta.sarif
          category: nexus-capability-delta
