# Pre-commit hooks for tpt-nexus.
#
# Install with:  pre-commit install
# Run all:       pre-commit run --all-files
#
# Keep these in lock-step with the CI workflow and the `justfile` so local and
# CI enforcement never drift.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
