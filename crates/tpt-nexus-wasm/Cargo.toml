[package]
name = "tpt-nexus-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Experimental WASM bindings for tpt-nexus verify+derive (browser demo)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tpt-nexus-orchestrator = { path = "../tpt-nexus-orchestrator" }
