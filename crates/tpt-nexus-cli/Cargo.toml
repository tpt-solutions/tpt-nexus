[package]
name = "tpt-nexus-cli"
description = "Command-line interface for tpt-nexus: verify, attest, and diff .telos capability surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cli", "verification", "capabilities", "attestation", "command-line"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "nexus"
path = "src/main.rs"

[features]
default = []
# Forwarded to the nexus orchestrator / telos SDK: enables the LLM-backed
# `CodeAgent`. When off (the default), the CLI only ever uses `StaticAgent`
# and pulls no network/HTTP dependencies. Set `NEXUS_AGENT=llm` at runtime
# (with `TELAS_LLM_KEY` etc.) to drive the loop with a real model.
llm = ["tpt-nexus-orchestrator/llm"]

[dependencies]
tpt-nexus-orchestrator.workspace = true
tpt-nexus-archon-emulator.workspace = true
tpt-archon-bridge.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
serde.workspace = true
